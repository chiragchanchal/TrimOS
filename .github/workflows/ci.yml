name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Verify TrimOS release APK
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "TrimOS release APK size: $((size / 1024)) KB"
          test -f launcher/app/build/outputs/apk/release/app-release.apk || { echo "Release APK not found"; exit 1; }
          # TrimOS bundles 32 themes and 4K wallpapers; budget is under 35 MB
          test "$size" -lt 36700160 || { echo "APK exceeds 35 MB budget"; exit 1; }

  tools-and-docs:
    name: Tools and environment verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Verify CLI tools and syntax
        run: |
          python3 trimos.py --help
          python3 tools/check.py --help
